name: Convocatorias - Recordatorios diarios

on:
  workflow_dispatch:
  # Cron diario desactivado: fallaba desde julio por falta del secreto
  # GOOGLE_SERVICE_ACCOUNT_JSON en el repo. Reactivar el bloque `schedule`
  # una vez configurado el secreto.
  # schedule:
  #   - cron: "0 13 * * *"  # 13:00 UTC = 8:00 am hora Peru

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_CONTROL_ID: ${{ secrets.GOOGLE_SHEETS_CONTROL_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enviar recordatorios pendientes
        run: python main.py
