name: Convocatorias - Exportar respuestas a Sheets

on:
  workflow_dispatch:
    inputs:
      convocatoria_id:
        description: "ID de convocatoria a exportar (vacío = todas)"
        required: false
        type: string

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_EXPORT_ID: ${{ secrets.GOOGLE_SHEETS_EXPORT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exportar respuestas a Sheets
        run: |
          python scripts/exportar_respuestas_sheets.py \
            ${{ inputs.convocatoria_id && format('--convocatoria-id {0}', inputs.convocatoria_id) || '' }}
